<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Léa Tramati — Graphic Designer</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect trick.
      // Encodes the requested path into a query string so index.html can restore it before React Router mounts.
      var pathSegmentsToKeep = 1; // keep "/Lea_tramati_2026"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
